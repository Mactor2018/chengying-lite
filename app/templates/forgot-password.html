<!DOCTYPE html>
<html data-bs-theme="light" lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>CareBridge - Password Recovery</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap/css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='fonts/font-awesome.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/carebridge.css') }}">
</head>

<body class="login-page">
    <main class="login-shell">
        <section class="login-panel recovery-panel">
            <div class="recovery-header">
                <a class="recovery-back-link" href="{{ url_for('auth.login_form') }}">
                    <i class="fa fa-angle-left" aria-hidden="true"></i>
                    <span>Back to sign in</span>
                </a>
                <div class="avatar avatar-station recovery-logo">CB</div>
            </div>
            <p class="eyebrow mb-1">Account Recovery</p>
            <h1>Reset your password</h1>
            {% if notice %}
            <div class="alert alert-info" role="alert">{{ notice }}</div>
            {% endif %}
            {% if error %}
            <div class="alert alert-danger" role="alert">{{ error }}</div>
            {% endif %}

            {% if step == "verify" %}
            <div class="recovery-summary mb-3">
                <span>Recovery account</span>
                <strong>{{ identifier }}</strong>
                <small>{{ email }}</small>
            </div>
            <div class="recovery-code-heading mb-2">
                <label class="form-label" for="verificationCode">Email verification code</label>
                <form class="recovery-resend-form" method="post" action="{{ url_for('auth.forgot_password_submit') }}">
                    <input name="step" type="hidden" value="resend">
                    <button class="btn btn-sm btn-light recovery-resend-button" type="submit" data-resend-seconds="{{ resend_available_in|default(0) }}" {% if resend_available_in|default(0) > 0 %}disabled{% endif %}>
                        {% if resend_available_in|default(0) > 0 %}
                        Resend in {{ resend_available_in }}s
                        {% else %}
                        Resend code
                        {% endif %}
                    </button>
                </form>
            </div>
            <form method="post" action="{{ url_for('auth.forgot_password_submit') }}">
                <input name="step" type="hidden" value="verify">
                <div class="mb-3">
                    <input class="form-control" id="verificationCode" name="verification_code" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit code" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="newPassword">New password</label>
                    <input class="form-control" id="newPassword" name="new_password" type="password" minlength="6" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="confirmPassword">Confirm new password</label>
                    <input class="form-control" id="confirmPassword" name="confirm_password" type="password" minlength="6" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Reset password</button>
            </form>
            {% else %}
            <form method="post" action="{{ url_for('auth.forgot_password_submit') }}">
                <input name="step" type="hidden" value="request">
                <div class="mb-3">
                    <label class="form-label" for="recoveryIdentifier">Account name</label>
                    <input class="form-control" id="recoveryIdentifier" name="identifier" value="{{ identifier }}" placeholder="admin" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="recoveryEmail">Recovery email</label>
                    <input class="form-control" id="recoveryEmail" name="email" type="email" value="{{ email }}" placeholder="name@example.com" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Continue</button>
            </form>
            {% endif %}
        </section>
    </main>
    <script>
        document.querySelectorAll("[data-resend-seconds]").forEach(function (button) {
            var remaining = parseInt(button.getAttribute("data-resend-seconds") || "0", 10);
            if (!remaining) {
                return;
            }
            var update = function () {
                if (remaining <= 0) {
                    button.disabled = false;
                    button.textContent = "Resend code";
                    return;
                }
                button.disabled = true;
                button.textContent = "Resend in " + remaining + "s";
                remaining -= 1;
                window.setTimeout(update, 1000);
            };
            update();
        });
    </script>
</body>

</html>
